<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Multitrack</title>
<style>
:root{--hd:118px;--h:72px}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#16181c;color:#ddd;margin:0;user-select:none;-webkit-user-select:none}
#bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:8px;background:#23262c;border-bottom:1px solid #000}
#bar button,#open{background:#33373f;color:#eee;border:0;border-radius:5px;height:36px;min-width:40px;font-size:16px;display:grid;place-items:center;padding:0 10px}
#pp.on{background:#2e9e5b}
#tm{font:600 20px ui-monospace,monospace;background:#0c0d0f;color:#7fe0a0;padding:4px 10px;border-radius:4px;letter-spacing:1px}
#f{display:none}
#ruler{display:flex;background:#1d2025;border-bottom:1px solid #000;position:sticky;top:52px;z-index:1}
#ruler div{width:var(--hd);flex:none;font-size:11px;color:#777;padding:4px 6px}
canvas{display:block;flex:1;min-width:0;width:100%;touch-action:none}
#ruler canvas{height:22px}
.tr{display:flex;border-bottom:1px solid #0c0d0f;height:var(--h)}
.hd{width:var(--hd);flex:none;background:#23262c;border-left:4px solid var(--c);padding:4px 5px;display:flex;flex-direction:column;gap:3px}
.nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:4px;align-items:center}
.hd button{background:#33373f;color:#bbb;border:0;border-radius:3px;width:26px;height:20px;font:700 11px sans-serif;padding:0}
.hd button.m.on{background:#e0533d;color:#fff}.hd button.s.on{background:#f0c330;color:#000}
.hd input{flex:1;min-width:0;height:14px;margin:0;accent-color:var(--c)}
.hd small{font-size:9px;color:#888;width:9px}
.tr canvas{height:100%;background:#1a1c20}
.tr.off .hd{opacity:.5}
#empty{padding:24px;color:#777;text-align:center}
</style></head><body>
<div id="bar">
  <label id="open">📂<input type="file" id="f" multiple accept="audio/*"></label>
  <button id="home">⏮</button><button id="pp">▶</button>
  <span id="tm">0:00.0</span><span id="len" style="color:#888;font-size:13px"></span>
</div>
<div id="ruler"><div>TRACKS</div><canvas id="rc"></canvas></div>
<div id="tracks"><div id="empty">📂 눌러서 트랙 파일들을 한꺼번에 선택</div></div>
<script>
const ctx = new AudioContext(), tracks = [];
const COLORS = ['#4aa8ff','#f0c330','#e0533d','#3fcf8e','#b07cff','#ff8a3d','#35d0d0','#ff6fb0'];
let srcs = [], startAt = 0, offset = 0, playing = false, dur = 0;
const fmt = (s, d) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` + (d ? `.${Math.floor(s*10%10)}` : '');
const pos = () => playing ? Math.min(ctx.currentTime - startAt, dur) : offset;
const dpr = devicePixelRatio;

// Mute/solo: a track sounds if not muted and (no solo active or it is soloed).
function applyMix() {
  const anySolo = tracks.some(t => t.solo);
  for (const t of tracks) {
    const on = !t.mute && (!anySolo || t.solo);
    t.gain.gain.value = on ? t.vol : 0; t.el.classList.toggle('off', !on);
  }
}

f.onchange = async () => {
  stop(); offset = 0; dur = 0; tracks.length = 0;
  const box = document.getElementById('tracks'); box.innerHTML = '<div id="empty">불러오는 중…</div>';
  const loaded = [];
  for (const file of [...f.files].sort((a,b) => a.name.localeCompare(b.name))) {
    const buf = await ctx.decodeAudioData(await file.arrayBuffer());
    const gain = ctx.createGain(), pan = ctx.createStereoPanner();
    gain.connect(pan).connect(ctx.destination);
    loaded.push({name: file.name.replace(/\.[^.]+$/, ''), buf, gain, pan, vol: 1, mute: false, solo: false, peaks: peaks(buf)});
  }
  box.innerHTML = '';
  loaded.forEach((t, i) => { t.color = COLORS[i % COLORS.length]; box.append(trackEl(t)); });
  tracks.push(...loaded);  // publish only once fully built, so tick() never sees half-made tracks
  dur = Math.max(0, ...tracks.map(t => t.buf.duration));
  len.textContent = '/ ' + fmt(dur); resize(); applyMix();
};

// Min/max per bucket, computed once; drawing scales it to whatever the lane width is.
function peaks(buf, n = 2000) {
  const chs = [...Array(buf.numberOfChannels)].map((_, i) => buf.getChannelData(i)), step = Math.ceil(buf.length / n), out = new Float32Array(n * 2);
  for (let b = 0; b < n; b++) {
    let lo = 0, hi = 0;
    for (const d of chs) for (let i = b * step, e = Math.min(i + step, d.length); i < e; i++) { const v = d[i]; if (v < lo) lo = v; else if (v > hi) hi = v; }
    out[b*2] = lo; out[b*2+1] = hi;
  }
  return out;
}

function trackEl(t) {
  const d = document.createElement('div'); d.className = 'tr'; d.style.setProperty('--c', t.color);
  d.innerHTML = `<div class="hd"><div class="nm"></div>
    <div class="row"><button class="m">M</button><button class="s">S</button><input class="v" type="range" min="0" max="1.5" step="0.01" value="1"></div>
    <div class="row"><small>L</small><input class="p" type="range" min="-1" max="1" step="0.01" value="0"><small>R</small></div></div><canvas></canvas>`;
  d.querySelector('.nm').textContent = t.name;
  const m = d.querySelector('.m'), s = d.querySelector('.s');
  m.onclick = () => { t.mute = !t.mute; m.classList.toggle('on', t.mute); applyMix(); };
  s.onclick = () => { t.solo = !t.solo; s.classList.toggle('on', t.solo); applyMix(); };
  d.querySelector('.v').oninput = e => { t.vol = +e.target.value; applyMix(); };
  d.querySelector('.v').ondblclick = e => { e.target.value = t.vol = 1; applyMix(); };
  d.querySelector('.p').oninput = e => { t.pan.pan.value = +e.target.value; };
  d.querySelector('.p').ondblclick = e => { e.target.value = t.pan.pan.value = 0; };
  t.el = d; t.cv = d.querySelector('canvas'); scrub(t.cv);
  return d;
}

function renderWave(t) {
  const w = t.cv.width = t.cv.clientWidth * dpr, h = t.cv.height = t.cv.clientHeight * dpr, n = t.peaks.length / 2;
  const off = t.wave = document.createElement('canvas'); off.width = w; off.height = h;
  const g = off.getContext('2d'); g.fillStyle = t.color;
  for (let x = 0; x < w; x++) {
    let lo = 0, hi = 0;
    for (let b = Math.floor(x / w * n), e = Math.max(b + 1, Math.floor((x + 1) / w * n)); b < e; b++) { lo = Math.min(lo, t.peaks[b*2]); hi = Math.max(hi, t.peaks[b*2+1]); }
    g.fillRect(x, (1 - hi) * h / 2, 1, Math.max(1, (hi - lo) * h / 2));
  }
}
function resize() {
  tracks.forEach(renderWave);
  rc.width = rc.clientWidth * dpr; rc.height = rc.clientHeight * dpr;
}
addEventListener('resize', resize);

// Drag on the ruler or any lane to scrub; playback resumes on release.
function scrub(cv) {
  let was = false;
  const at = e => { const r = cv.getBoundingClientRect(); return Math.max(0, Math.min(dur, (e.clientX - r.left) / r.width * dur)); };
  cv.onpointerdown = e => { if (!dur) return; cv.setPointerCapture(e.pointerId); was = playing; stop(); offset = at(e); };
  cv.onpointermove = e => { if (cv.hasPointerCapture(e.pointerId)) offset = at(e); };
  cv.onpointerup = () => { if (was) play(); was = false; };
}
scrub(rc);

function play() {
  if (!tracks.length) return;
  ctx.resume();
  if (offset >= dur) offset = 0;
  const when = ctx.currentTime + 0.05;  // common start time keeps all tracks sample-aligned
  srcs = tracks.map(t => { const s = ctx.createBufferSource(); s.buffer = t.buf; s.connect(t.gain); s.start(when, offset); return s; });
  srcs[0].onended = () => { if (playing && pos() >= dur - 0.1) { stop(); offset = 0; } };
  startAt = when - offset; playing = true; pp.textContent = '⏸'; pp.classList.add('on');
}
function stop() {
  if (playing) offset = pos();
  srcs.forEach(s => { s.onended = null; s.stop(); }); srcs = [];
  playing = false; pp.textContent = '▶'; pp.classList.remove('on');
}
pp.onclick = () => playing ? stop() : play();
home.onclick = () => { const was = playing; stop(); offset = 0; if (was) play(); };

function drawRuler(p) {
  const g = rc.getContext('2d'), w = rc.width, h = rc.height;
  g.clearRect(0, 0, w, h);
  if (!dur) return;
  const every = [5, 10, 15, 30, 60].find(s => w / dur * s > 50 * dpr) || 60;
  g.fillStyle = '#888'; g.font = `${10 * dpr}px sans-serif`;
  for (let s = 0; s <= dur; s += every) { const x = s / dur * w; g.fillRect(x, h * .55, 1, h); g.fillText(fmt(s), x + 3 * dpr, h * .5); }
  g.fillStyle = '#fff'; g.fillRect(p / dur * w - dpr, 0, 2 * dpr, h);
}
function tick() {
  requestAnimationFrame(tick);  // schedule first so one bad frame can't kill the loop
  const p = pos(); tm.textContent = fmt(p, true); drawRuler(p);
  for (const t of tracks) {
    const g = t.cv.getContext('2d'), w = t.cv.width, h = t.cv.height;
    g.clearRect(0, 0, w, h);
    g.globalAlpha = t.gain.gain.value > 0 ? 1 : 0.25; g.drawImage(t.wave, 0, 0); g.globalAlpha = 1;
    g.fillStyle = '#fff'; g.fillRect(p / dur * w - dpr, 0, 2 * dpr, h);
  }
}
tick();
</script></body></html>
